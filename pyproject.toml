[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fnb-forecast"
version = "0.1.0"
description = "Food and beverage time-series forecasting"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "holidays>=0.78,<1",
    "httpx>=0.28,<1",
    "lightgbm>=4.7,<5",
    "numpy>=2,<3",
    "pandas>=2,<3",
    "pydantic>=2,<3",
    "plotly>=6,<7",
    "PyYAML>=6,<7",
    "pytorch-forecasting>=1.8,<2",
    "statsforecast>=2,<3",
    "streamlit>=1.60,<2",
    "torch>=2.0,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[project.scripts]
fnb-forecast = "fnb_forecast.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fnb_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
